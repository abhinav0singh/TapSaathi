<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img"><title>Sahara Architecture</title><style>text{font-family:Arial,Helvetica,sans-serif}.t{fill:#152925}.muted{fill:#60736d}.line{stroke:#b4c8bd;stroke-width:2}@media(prefers-reduced-motion:no-preference){.pulse{animation:glow 2.8s ease-in-out infinite}.travel{animation:dash 6s linear infinite}@keyframes glow{50%{opacity:.35}}@keyframes dash{to{stroke-dashoffset:-80}}}</style><rect width="1000" height="405" rx="24" fill="#f6f8f6"/><text x="38" y="49" font-size="25" font-weight="700" class="t">Event-driven, identity-aware AWS architecture</text><text x="38" y="78" font-size="15" class="muted">Simplified service relationships; the live stack is defined in AWS CDK.</text><rect x="38" y="111" width="276" height="71" rx="13" fill="#fff" stroke="#d9e5dd"/><text x="176.0" y="140" text-anchor="middle" font-size="16" font-weight="700" class="t">Weather + demo spike</text><text x="176.0" y="162" text-anchor="middle" font-size="13" class="muted">Risk policy</text><rect x="362" y="111" width="276" height="71" rx="13" fill="#fff" stroke="#d9e5dd"/><text x="500.0" y="140" text-anchor="middle" font-size="16" font-weight="700" class="t">Amazon EventBridge</text><text x="500.0" y="162" text-anchor="middle" font-size="13" class="muted">Risk events</text><rect x="686" y="111" width="276" height="71" rx="13" fill="#e4f3e9" stroke="#b7d8c5"/><text x="824.0" y="140" text-anchor="middle" font-size="16" font-weight="700" class="t">AWS Step Functions</text><text x="824.0" y="162" text-anchor="middle" font-size="13" class="muted">Durable orchestration</text><rect x="38" y="251" width="276" height="71" rx="13" fill="#fff" stroke="#d9e5dd"/><text x="176.0" y="280" text-anchor="middle" font-size="16" font-weight="700" class="t">AWS Amplify + Next.js</text><text x="176.0" y="302" text-anchor="middle" font-size="13" class="muted">Rider · operator · supervisor</text><rect x="362" y="251" width="276" height="71" rx="13" fill="#fff" stroke="#d9e5dd"/><text x="500.0" y="280" text-anchor="middle" font-size="16" font-weight="700" class="t">Cognito + API Gateway</text><text x="500.0" y="302" text-anchor="middle" font-size="13" class="muted">Authenticated actions</text><rect x="686" y="251" width="276" height="71" rx="13" fill="#fff" stroke="#d9e5dd"/><text x="824.0" y="280" text-anchor="middle" font-size="16" font-weight="700" class="t">AWS Lambda + DynamoDB</text><text x="824.0" y="302" text-anchor="middle" font-size="13" class="muted">Actions · state · audit</text><path d="M314 146 H362 M638 146 H686 M176 251 V218 H824 V182 M314 286 H362 M638 286 H686" fill="none" stroke="#609b7f" stroke-width="3"/><path d="M355 140 l7 6 -7 6 M679 140 l7 6 -7 6 M355 280 l7 6 -7 6 M679 280 l7 6 -7 6" fill="none" stroke="#609b7f" stroke-width="2"/><rect x="38" y="350" width="924" height="35" rx="9" fill="#e7eeea"/><text x="500" y="373" font-size="14" text-anchor="middle" class="t">Supporting services: Amazon Location · Amazon Polly · Private S3 · CloudWatch · AWS CDK</text></svg>