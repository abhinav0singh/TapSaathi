<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sahara turns heat signals into coordinated support</title>
  <desc id="desc">A Sahara diagram showing a heat signal flowing through a deterministic policy to rider, delivery, and supervisor actions.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#f2dfbd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#432818" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#sky)"/>
  <path d="M0 426C172 350 300 476 493 400s326-8 707-97v217H0Z" fill="#d7772e" opacity=".2"/>
  <text x="72" y="92" fill="#402316" font-family="Arial, sans-serif" font-size="48" font-weight="700">SAHARA</text>
  <text x="72" y="132" fill="#6c4631" font-family="Arial, sans-serif" font-size="22">Heat signals become coordinated support—not just alerts.</text>
  <g fill="none" stroke="#a75b2b" stroke-linecap="round" stroke-width="8">
    <path d="M280 288H344"/><path d="M542 288H606"/><path d="M804 288H868"/>
  </g>
  <g fill="#a75b2b"><path d="m342 276 22 12-22 12z"/><path d="m604 276 22 12-22 12z"/><path d="m866 276 22 12-22 12z"/></g>
  <g filter="url(#shadow)">
    <rect x="72" y="215" width="208" height="146" rx="24" fill="#fffdf9"/>
    <circle cx="112" cy="258" r="18" fill="#e98a35"/>
    <path d="M112 226v11m0 42v11m-32-32h11m42 0h11m-44-23 8 8m23 23 8 8m0-39-8 8m-23 23-8 8" stroke="#fffdf9" stroke-width="4" stroke-linecap="round"/>
    <text x="144" y="263" fill="#402316" font-family="Arial, sans-serif" font-size="24" font-weight="700">Heat signal</text>
    <text x="96" y="314" fill="#6c4631" font-family="Arial, sans-serif" font-size="19">weather + active time</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="344" y="215" width="198" height="146" rx="24" fill="#fffdf9"/>
    <path d="m382 253 12-16 13 16 18-5-3 19 14 13-17 8-1 19-18-5-16 12-6-18-19-4 10-16-6-18 18 2z" fill="#d7772e"/>
    <text x="424" y="263" fill="#402316" font-family="Arial, sans-serif" font-size="24" font-weight="700">Policy</text>
    <text x="367" y="314" fill="#6c4631" font-family="Arial, sans-serif" font-size="19">deterministic decision</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="606" y="215" width="198" height="146" rx="24" fill="#fffdf9"/>
    <circle cx="649" cy="252" r="18" fill="#0f755f"/>
    <path d="M649 239v17m-12 19c4-13 20-13 24 0" fill="none" stroke="#fffdf9" stroke-linecap="round" stroke-width="4"/>
    <text x="687" y="263" fill="#402316" font-family="Arial, sans-serif" font-size="24" font-weight="700">Rider action</text>
    <text x="629" y="314" fill="#6c4631" font-family="Arial, sans-serif" font-size="19">guidance + response</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="868" y="215" width="260" height="146" rx="24" fill="#fffdf9"/>
    <path d="M906 243h42v33h-42z" fill="#26786e"/><path d="M913 251h28m-28 9h28m-28 9h17" stroke="#fffdf9" stroke-width="3"/>
    <text x="971" y="263" fill="#402316" font-family="Arial, sans-serif" font-size="24" font-weight="700">Team support</text>
    <text x="892" y="314" fill="#6c4631" font-family="Arial, sans-serif" font-size="19">delivery + follow-up</text>
  </g>
  <text x="72" y="459" fill="#6c4631" font-family="Arial, sans-serif" font-size="20">A prototype for accountable outdoor-work coordination.</text>
</svg>
