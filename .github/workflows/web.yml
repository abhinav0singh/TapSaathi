name: Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-web:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@taapsaathi/contracts
      - run: npm run typecheck --workspace=@taapsaathi/web
      - run: npm run build --workspace=@taapsaathi/web
