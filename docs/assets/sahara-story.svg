<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>Sahara Story</title><style>text{font-family:Arial,Helvetica,sans-serif}.t{fill:#152925}.muted{fill:#60736d}.line{stroke:#b4c8bd;stroke-width:2}@media(prefers-reduced-motion:no-preference){.pulse{animation:glow 2.8s ease-in-out infinite}.travel{animation:dash 6s linear infinite}@keyframes glow{50%{opacity:.35}}@keyframes dash{to{stroke-dashoffset:-80}}}</style><rect width="1000" height="320" rx="24" fill="#f6f5ef"/><rect x="28" y="28" width="944" height="264" rx="18" fill="#ffffff"/><text x="65" y="85" font-size="31" font-weight="700" class="t">Heat risk should trigger action.</text><text x="65" y="116" font-size="17" class="muted">One coordinated response for riders, dispatch and supervisors.</text><path d="M135 202 H860" stroke="#c7d9d0" stroke-width="5" stroke-dasharray="10 12" class="travel"/><g><rect x="54" y="159" width="190" height="93" rx="16" fill="#fff8ee" stroke="#efdcc2"/><circle cx="81" cy="184" r="9" fill="#e98632" class="pulse"/><text x="99" y="190" font-size="17" font-weight="700" class="t">Detect</text><text x="74" y="223" font-size="14" class="muted">Risk + exposure</text><rect x="289" y="159" width="190" height="93" rx="16" fill="#f3f8f4" stroke="#d7e6d9"/><circle cx="316" cy="184" r="9" fill="#269c75" class="pulse"/><text x="334" y="190" font-size="17" font-weight="700" class="t">Guide</text><text x="309" y="223" font-size="14" class="muted">Rider choices</text><rect x="524" y="159" width="190" height="93" rx="16" fill="#f3f8f4" stroke="#d7e6d9"/><circle cx="551" cy="184" r="9" fill="#269c75" class="pulse"/><text x="569" y="190" font-size="17" font-weight="700" class="t">Protect</text><text x="544" y="223" font-size="14" class="muted">Delivery coverage</text><rect x="759" y="159" width="190" height="93" rx="16" fill="#fff8ee" stroke="#efdcc2"/><circle cx="786" cy="184" r="9" fill="#e98632" class="pulse"/><text x="804" y="190" font-size="17" font-weight="700" class="t">Follow up</text><text x="779" y="223" font-size="14" class="muted">Human accountability</text></g></svg>