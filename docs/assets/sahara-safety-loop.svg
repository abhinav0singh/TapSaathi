<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sahara intervention loop</title>
  <desc id="desc">A six-step Sahara loop: sense, decide, guide, protect, confirm, and recover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153d39"/><stop offset="1" stop-color="#0a2624"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <text x="72" y="86" fill="#f8d99e" font-family="Arial, sans-serif" font-size="46" font-weight="700">SAHARA INTERVENTION LOOP</text>
  <text x="72" y="124" fill="#c9ddd3" font-family="Arial, sans-serif" font-size="21">A clear, auditable sequence for coordinating a heat-risk response.</text>
  <g fill="none" stroke="#f1b766" stroke-linecap="round" stroke-width="7" stroke-dasharray="3 17">
    <path d="M241 296c39-115 207-133 277-38"/><path d="M523 248c119-67 259 2 275 118"/><path d="M796 371c-95 102-297 80-342-45"/><path d="M453 326C370 405 185 397 155 278"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><circle cx="194" cy="270" r="65" fill="#f1b766"/><text x="194" y="263" fill="#173b37" font-size="22" font-weight="700">1</text><text x="194" y="292" fill="#173b37" font-size="22" font-weight="700">Sense</text><text x="194" y="374" fill="#dce9e4" font-size="18">heat context</text></g>
    <g><circle cx="456" cy="243" r="65" fill="#e78843"/><text x="456" y="236" fill="#173b37" font-size="22" font-weight="700">2</text><text x="456" y="265" fill="#173b37" font-size="22" font-weight="700">Decide</text><text x="456" y="347" fill="#dce9e4" font-size="18">policy result</text></g>
    <g><circle cx="712" cy="270" r="65" fill="#82bf9a"/><text x="712" y="263" fill="#173b37" font-size="22" font-weight="700">3</text><text x="712" y="292" fill="#173b37" font-size="22" font-weight="700">Guide</text><text x="712" y="374" fill="#dce9e4" font-size="18">rider choices</text></g>
    <g><circle cx="894" cy="388" r="65" fill="#62aead"/><text x="894" y="381" fill="#173b37" font-size="22" font-weight="700">4</text><text x="894" y="410" fill="#173b37" font-size="22" font-weight="700">Protect</text><text x="894" y="490" fill="#dce9e4" font-size="18">delivery ownership</text></g>
    <g><circle cx="614" cy="423" r="65" fill="#d8d59e"/><text x="614" y="416" fill="#173b37" font-size="22" font-weight="700">5</text><text x="614" y="445" fill="#173b37" font-size="22" font-weight="700">Confirm</text><text x="614" y="493" fill="#dce9e4" font-size="18">human follow-up</text></g>
    <g><circle cx="320" cy="411" r="65" fill="#c7d9cf"/><text x="320" y="404" fill="#173b37" font-size="22" font-weight="700">6</text><text x="320" y="433" fill="#173b37" font-size="22" font-weight="700">Recover</text><text x="320" y="493" fill="#dce9e4" font-size="18">audited outcome</text></g>
  </g>
</svg>
